name: Rotate Cloudflare R2 Token

# Runs on the 1st of every month at 08:00 UTC.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  rotate:
    name: Rotate R2 API Token
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      actions: write  # needed to dispatch the deploy workflow after rotation

    steps:
      # ── 1. Create new Cloudflare R2 token ──────────────────────────────────
      - name: Rotate Cloudflare R2 token
        id: cf
        env:
          CF_ACCOUNT_ID:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          # R2 S3 credentials are derived from a regular Cloudflare API token:
          #   Access Key ID     = token id
          #   Secret Access Key = sha256(token value)
          # https://developers.cloudflare.com/r2/api/tokens/
          #
          # CF_ADMIN_TOKEN needs the account permission "Account API Tokens: Edit"
          # so it can create/list/delete account-owned API tokens.
          TOKEN_NAME="portfolio-r2-rotating"
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"

          # cf METHOD PATH [JSON_BODY] — prints body, fails loudly with the API error
          cf() {
            local resp code body
            resp=$(curl -s -w "\n%{http_code}" -X "$1" "${API}$2" \
              -H "Authorization: Bearer ${CF_ADMIN_TOKEN}" \
              -H "Content-Type: application/json" ${3:+-d "$3"})
            code=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | head -n -1)
            if [ "${code:0:1}" != "2" ]; then
              echo "ERROR: $1 $2 returned HTTP ${code}" >&2
              echo "$body" | jq '.errors // .' >&2 || echo "$body" >&2
              return 1
            fi
            echo "$body"
          }

          # ── Clean up rotating tokens that have already expired ────────────
          NOW=$(date -u +%s)
          cf GET "/tokens?per_page=100" \
            | jq -r --arg name "$TOKEN_NAME" --argjson now "$NOW" \
                '.result[] | select(.name == $name)
                 | select(.expires_on != null and (.expires_on | sub("\\.[0-9]+Z$";"Z") | fromdateiso8601) < $now)
                 | .id' \
            | while read -r id; do
                cf DELETE "/tokens/${id}" > /dev/null \
                  && echo "Deleted expired token ${id}" \
                  || echo "WARNING: could not delete ${id} (continuing)"
              done

          # ── Look up the R2 bucket write permission group ──────────────────
          PG_ID=$(cf GET "/tokens/permission_groups" \
            | jq -r '.result[] | select(.name == "Workers R2 Storage Bucket Item Write") | .id' | head -1)
          if [ -z "$PG_ID" ]; then
            echo "ERROR: permission group 'Workers R2 Storage Bucket Item Write' not found"
            exit 1
          fi

          # ── Create a new token valid for 40 days ──────────────────────────
          # Runs monthly (31-day max gap) → 9-day buffer. Older tokens are not
          # revoked here so the running deployment keeps working until the
          # redeploy finishes; they expire on their own and get cleaned up above.
          EXPIRES=$(date -u -d '40 days' '+%Y-%m-%dT%H:%M:%SZ')
          RESOURCE="com.cloudflare.edge.r2.bucket.${CF_ACCOUNT_ID}_default_${R2_BUCKET_NAME}"
          BODY=$(jq -n --arg name "$TOKEN_NAME" --arg exp "$EXPIRES" --arg res "$RESOURCE" --arg pg "$PG_ID" \
            '{name: $name, expires_on: $exp,
              policies: [{effect: "allow", resources: {($res): "*"}, permission_groups: [{id: $pg}]}]}')

          RESPONSE=$(cf POST "/tokens" "$BODY")
          ACCESS_KEY=$(echo "$RESPONSE" | jq -r '.result.id')
          TOKEN_VALUE=$(echo "$RESPONSE" | jq -r '.result.value')

          if [ -z "$ACCESS_KEY" ] || [ "$ACCESS_KEY" = "null" ] || [ -z "$TOKEN_VALUE" ] || [ "$TOKEN_VALUE" = "null" ]; then
            echo "ERROR: unexpected token creation response"
            exit 1
          fi
          SECRET_KEY=$(printf '%s' "$TOKEN_VALUE" | sha256sum | cut -d' ' -f1)

          # Mask values so they never appear in plain text in any log line
          echo "::add-mask::$TOKEN_VALUE"
          echo "::add-mask::$ACCESS_KEY"
          echo "::add-mask::$SECRET_KEY"

          echo "ACCESS_KEY_ID=$ACCESS_KEY"    >> "$GITHUB_OUTPUT"
          echo "SECRET_ACCESS_KEY=$SECRET_KEY" >> "$GITHUB_OUTPUT"
          echo "New R2 token created (expires ${EXPIRES})"

      # ── 2. Propagate new credentials to Vercel ─────────────────────────────
      - name: Update Vercel environment variables
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID:    ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEW_ACCESS_KEY:    ${{ steps.cf.outputs.ACCESS_KEY_ID }}
          NEW_SECRET_KEY:    ${{ steps.cf.outputs.SECRET_ACCESS_KEY }}
        run: |
          BASE="https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env"
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"

          # Upsert a single env var: PATCH if it already exists, POST if new.
          upsert_env() {
            local KEY="$1"
            local VAL="$2"

            local EXISTING_ID
            EXISTING_ID=$(curl -sf "${BASE}?teamId=${VERCEL_TEAM_ID}" \
              -H "$AUTH" \
              | jq -r --arg k "$KEY" '.envs[] | select(.key == $k and (.target | contains(["production"]))) | .id // empty' \
              | head -1)

            if [ -n "$EXISTING_ID" ]; then
              curl -sf -X PATCH "${BASE}/${EXISTING_ID}?teamId=${VERCEL_TEAM_ID}" \
                -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"value\": \"$VAL\"}" > /dev/null
              echo "Updated $KEY in Vercel (production)"
            else
              curl -sf -X POST "${BASE}?teamId=${VERCEL_TEAM_ID}" \
                -H "$AUTH" -H "Content-Type: application/json" \
                -d "{
                  \"key\": \"$KEY\",
                  \"value\": \"$VAL\",
                  \"type\": \"sensitive\",
                  \"target\": [\"production\"]
                }" > /dev/null
              echo "Created $KEY in Vercel (production)"
            fi
          }

          upsert_env "R2_ACCESS_KEY_ID"     "$NEW_ACCESS_KEY"
          upsert_env "R2_SECRET_ACCESS_KEY" "$NEW_SECRET_KEY"

      # ── 3. Redeploy so Vercel picks up the new env vars ────────────────────
      - name: Trigger production redeploy
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref": "main"}'
          echo "Deploy workflow dispatched on main"
